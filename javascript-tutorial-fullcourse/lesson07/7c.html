<!DOCTYPE html>
<html lang="en">

    <title>7c</title>

  <body>
    <script>
      function greet(name) {
        if (name) {
          console.log(`Hello ${name}!`);
        } else {
          console.log('Hi there!');
        }
      }

      greet('Jennifer');
      greet('Jing Yuan');
      greet('Sabrina Carpenter');
      greet();
    </script>
  </body>
