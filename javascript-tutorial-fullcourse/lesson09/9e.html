<!DOCTYPE html>
<html lang="en">
  <head>
    <title>9d</title>
  </head>
  <body>
    <input type="text" placeholder="Name" onkeydown="
      handleCostKeydown(event);
    ">

    <button onclick="
      displayName();
    ">Submit</button>

    <p></p>

    <script>
      function handleCostKeydown(event) {
        if (event.key === 'Enter') {
          displayName();
        }
      }

      function displayName() {
        const text = document.querySelector('input').value;
        document.querySelector('p').innerHTML = `Your name is: ${text}`;
      }
    </script>
  </body>
</html>
