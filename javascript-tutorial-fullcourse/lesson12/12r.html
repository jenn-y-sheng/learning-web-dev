<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="styles/12r.css">
  </head>
  <body>
    <p class="title">Rock Paper Scissors</p>

    <button class="move-button js-rock-button">
      <img src="images/rock-emoji.png" alt="" class="move-icon">
    </button>

    <button class="move-button js-paper-button">
      <img src="images/paper-emoji.png" alt="" class=move-icon>
    </button>

    <button class="move-button js-scissors-button">
      <img src="images/scissors-emoji.png" alt="" class="move-icon">
    </button>

    <p class="js-result result"></p>
    <p class="js-moves"></p>
    <p class="js-score score"></p>

    <button class="reset-score-button js-reset-score-button">Reset Score</button>

    <button class="auto-play-button js-auto-play-button">Auto Play</button>

    <p class="confirmation-message js-confirmation-message"></p>

    <script src="scripts/12r.js"></script>
  </body>
</html>
