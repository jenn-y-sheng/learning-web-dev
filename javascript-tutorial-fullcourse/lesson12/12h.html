<!DOCTYPE html>
<html lang="en">
  <head>
    <title>App</title>
  </head>
  <body>
    <button onclick="
      addMessage();
    ">Add</button>

    <button onclick="
      removeMessage();
    ">Remove</button>
    <script>
      let messages = 2;

      function addMessage() {
        messages++;
      }

      function removeMessage() {
        messages--;
      }

      setInterval(function() {
        if (document.title === `(${messages}) New messages`) {
          document.title = 'App';
        } else {
          document.title = `(${messages}) New messages`;
        }
      }, 1000);
    </script>
  </body>
</html>
