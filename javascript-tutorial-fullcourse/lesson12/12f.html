<!DOCTYPE html>
<html lang="en">
  <head>
    <title>12f</title>
  </head>
  <body>
    <button onclick="
      addToCart();
    ">Add to cart</button>

    <p></p>

    <script>
      document.querySelector('button').addEventListener('click', () => {
        addToCart();
      });

      let timeoutId;

      function addToCart(){
        document.querySelector('p').innerHTML = 'Added';
        clearTimeout(timeoutId);
        timeoutId = setInterval(() => {
          document.querySelector('p').innerHTML = '';
        }, 2000);
      }
    </script>
  </body>
</html>
