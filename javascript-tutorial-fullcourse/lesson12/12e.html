<!DOCTYPE html>
<html lang="en">
  <head>
    <title>12e</title>
  </head>
  <body>
    <button>Add to cart</button>

    <p></p>

    <script>
      document.querySelector('button').addEventListener('click', () => {
        addToCart();
      });

      function addToCart(){
        document.querySelector('p').innerHTML = 'Added';
        setInterval(() => {
          document.querySelector('p').innerHTML = '';
        }, 2000);
      }
    </script>
  </body>
</html>
