<!DOCTYPE html>
<html lang="en">
  <head>
    <title>12d</title>
  </head>
  <body>
    <button onclick="
      finish();
    ">Start</button>

    <script>
      function finish() {
        setTimeout(function() {
          document.querySelector('button').innerHTML = 'Finished!';
        }, 1000);
        document.querySelector('button').innerHTML = 'Loading...';
      }
    </script>
  </body>
</html>
