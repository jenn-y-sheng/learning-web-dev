<!DOCTYPE html>
<html lang="en">
  <head>
    <title>12d</title>
  </head>
  <body>
    <button>Start</button>

    <script>
      document.querySelector('button').addEventListener('click', () => {
        finish();
      });

      function finish() {
        setTimeout(() => {
          document.querySelector('button').innerHTML = 'Finished!';
        }, 1000);
        document.querySelector('button').innerHTML = 'Loading...';
      }
    </script>
  </body>
</html>
