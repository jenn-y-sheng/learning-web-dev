<!DOCTYPE html>
<html lang="en">
  <head>
    <title>12o</title>
  </head>
  <body>
    <script>
      function removeEgg(foods) {
        let total = 0;
        return foods.filter(food => {
          if (food === 'egg' && total < 2) {
            total++;
            return false;
          }
          return true;
        });
      }

      console.log(removeEgg(['egg', 'apple', 'egg', 'egg', 'ham']));
    </script>
  </body>
</html>
