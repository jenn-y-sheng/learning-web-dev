<!DOCTYPE html>
<html lang="en">
  <head>
    <title>11j</title>
  </head>
  <body>
    <script>
      function addOne(array1, array2) {
        const newArray = [];
        for (let i = 0; i < array1.length; i++) {
          newArray.push(array1[i] + array2[i]);
        }
        return newArray;
      }

      console.log(addOne([1, 1, 2], [1, 1, 3]));
      console.log(addOne([1, 2, 3], [4, 5, 6]));
    </script>
  </body>
</html>
