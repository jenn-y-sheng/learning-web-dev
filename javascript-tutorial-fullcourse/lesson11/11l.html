<!DOCTYPE html>
<html lang="en">
  <head>
    <title>11l</title>
  </head>
  <body>
    <script>
      function minMax(nums) {
        let min = Number.MAX_SAFE_INTEGER;
        let max = 0;
        for (let i = 0; i < nums.length; i++) {
          const val = nums[i];
          if (val < min) {
            min = val;
          }
          if (val > max) {
            max = val;
          }
        }
        return { min: min, max: max };
      }

      console.log(minMax([1, -3, 5]));
      console.log(minMax([-2, 3, -5, 7, 10]));
    </script>
  </body>
</html>
