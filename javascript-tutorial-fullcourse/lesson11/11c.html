<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Document</title>
  </head>
  <body>
    <script>
      function arraySwap(array) {
        const first = array[0];
        const last = array[array.length - 1];
        array[0] = last;
        array[array.length - 1] = first;
        return array;
      }

      console.log(arraySwap([1, 20, 22, 24, 5]));
      console.log(arraySwap(['hi', 'hello', 'good']));
    </script>
  </body>
</html>
