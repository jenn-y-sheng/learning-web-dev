<!DOCTYPE html>
<html lang="en">
  <head>
    <title>11r</title>
  </head>
  <body>
    <script>
      function removeEgg(foods) {
        const noEggs = []
        for (let i = 0; i < foods.length; i++) {
          const food = foods[i];
          if (food === 'egg') {
            continue;
          }
          noEggs.push(food);
        }
        return noEggs;
      }
      console.log(removeEgg(['egg', 'apple', 'egg', 'egg', 'ham']));
    </script>
    </script>
  </body>
</html>
