      // auto boxing, 'hello' is a special object made automatically (wrapped around it)
      // does not work with null and undefined
      console.log('hello'.length);
      console.log('hello'.toUpperCase());

      // object1 is a pointer reference to somewhere in computer's memory where the actual object is
      const object1 = {
        message: 'hello'
      };

      // doesn't make copy of object, makes copy of reference to the same object
      const object2 = object1;

      // we can change this bc const doesn't let us change the reference in the variable, but we can reach into it and change the actual object
      object1.message = 'Good job!';
      console.log(object1);

      // also changed bc we changed the object that both of them point to
      console.log(object2);

      const object3 = {
        message: 'Good job!'
      };
       // not equal bc they're references
       // object3 points to a new object
      console.log(object3 === object1);
      console.log(object3 == object1);
      // they point to the same thing so true
      console.log(object2 === object1);

      const object4 = {
        message: 'Good job!',
        price: 799
      };
      // const message = object4.message;
      // destructuring, take message and price props out of object4 and save into var called message
      const { message, price } = object4;
      console.log(message);
      console.log(price);

      const object5 = {
        // message: message (shorthand property)
        message,
        // method: function function1() {
        //   console.log('method');
        // }
        // shorthand method
        method() {
          console.log('method');
        }
      };
      console.log(object5);
      object5.method();
    </script>
