<!DOCTYPE html>
<html lang="en">
<head>
  <title>Coin Flip</title>
</head>
<body>
  <button onclick="
    playGame('heads');
  ">heads</button>

  <button onclick="
    playGame('tails');
  ">tails</button>

  <script>
    let score = JSON.parse(localStorage.getItem('score')) || {
      wins: 0,
      losses: 0
    };

    function playGame(guess) {
      const num = Math.random();
      let result = '';
      (num < 0.5) ? result = 'heads' : result = 'tails';
      if (guess === result) {
        score.wins++;
        console.log('You win!');
      } else {
        score.losses++;
        console.log('You lose.');
      }
      console.log(score);
      localStorage.setItem('score', JSON.stringify(score));
    }
  </script>
</body>
</html>
