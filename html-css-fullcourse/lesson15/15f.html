<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Amazing Sale</title>
    <style>
      .container {
        position: relative;
        display: inline-block;
      }

      img {
        height: 400px;
      }

      .sale-tag {
        position: absolute;
        right: 0px;
        top: 10px;
        background-color: black;
        color: white;
        font-family: Arial;
        padding: 5px 10px;
      }

      .overlay {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 120px;
        background-color: rgba(255, 255, 255, 0.617);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      button {
        background-color: white;
        color: black;
        border: 1px solid black;
        padding: 10px 20px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <img src="trash.jpg" alt="">
      <div class="sale-tag">20% OFF</div>
      <div class="overlay">
        <button>Add to Cart</button>
      </div>
    </div>
  </body>
</html>
