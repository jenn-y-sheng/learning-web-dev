<!DOCTYPE html>
<html lang="en">
  <head>
    <title>14b</title>
    <style>
      body {
        height: 3000px;
        width: 3000px;
      }

      div {
        font-family: Arial;
      }

      .sidebar {
        background-color: green;
        color: white;
        position: fixed;
        right: 0;
        top: 0;
        bottom: 0;
        width: 100px;
      }

      .overlay {
        position: fixed;
        top: 0;
        bottom: 0;
        right: 0;
        left: 0;
        background-color: rgba(0, 0, 0, 0.8);
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .modal {
        background-color: white;
        width: 400px;
        justify-content: center;
        padding: 20px 20px;
        border-radius: 5px;
      }

      .modal-title {
        font-size: 30px;
        font-weight: bold;
        margin-bottom: 10px;
      }

      .modal-description {
        font-size: 18px;
        margin-bottom: 10px;
      }
    </style>
  </head>
  <body>
    <div class="sidebar">right sidebar</div>
    <div class="overlay">
      <div class="modal">
        <div class="modal-title">Modal Title</div>
        <div class="modal-description">This is a modal</div>
        <button>Close</button>
      </div>
    </div>
  </body>
</html>
