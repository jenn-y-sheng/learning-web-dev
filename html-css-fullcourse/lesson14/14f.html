<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Discord</title>
    <style>
      .body {
        height: 3000px;
      }

      div {
        font-family: Arial;
      }

      .sidebar {
        position: fixed;
        left: 0;
        top: 0;
        bottom: 0;
        width: 300px;
        background-color: aqua;
        display: flex;
      }

      .servers {
        background-color: rgb(43, 44, 49);
        display: flex;
        flex-direction: column;
        padding: 15px;
        row-gap: 10px;
      }

      img {
        height: 50px;
        width: 50px;
        border-radius: 25px;
      }

      .server-info {
        display: flex;
        flex-direction: column;
        width: 100%;
        padding: 15px 15px;
        background-color: rgb(57, 59, 65);
      }

      .server-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
      }

      .info {
        color: white;
        font-size: 14px;
        font-weight: bold;
        letter-spacing: 1px;
      }

      .channel {
        color: rgb(159, 159, 159);
        margin-bottom: 10px;
      }

      span {
        margin-left: 5px;
      }

      .plus {
        font-size: 25px;
        color: rgb(159, 159, 159);
      }
    </style>
  </head>
  <body>
    <div class="sidebar">
      <div class="servers">
        <img src="../lesson9/jingyuan.jpg" alt="">
        <img src="../lesson9/jingyuan2.jpg" alt="">
        <img src="../lesson9/jingyuan3.png" alt="">
      </div>
      <div class="server-info">
        <div class="server-header"> 
          <div class="info">INFO</div>
          <div class="plus">+</div>
        </div>
        <div class="channels">
          <div class="channel"># <span>new-videos</span></div>
          <div class="channel"># <span>updates</span></div>
          <div class="channel"># <span>faq</span></div>
        </div>
      </div>
    </div>
  </body>
</html>
